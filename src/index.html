<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUPHEAD</title>
  <meta name="description" content="Beli dan mainkan Cuphead! Game aksi run and gun klasik pemenang penghargaan dari Studio MDHR. Taklukkan puluhan bos epik dalam animasi kartun 1930-an yang digambar tangan, kuasai senjata mematikan, dan selamatkan jiwamu!">
  <link rel="icon" type="image/webp" href="./assets/web/logo.webp">
  <link rel="preload" href="./assets/web/hero.webp" as="image" type="image/webp" fetchpriority="high">
  <link rel="stylesheet" href="./css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
</head>
<body class="tv-screen-wrapper">
  <div id="preloader-mount"></div>

  <div class="tv-scanlines" aria-hidden="true"></div>
  <div class="tv-vignette" aria-hidden="true"></div>
  <div class="film-scratch" aria-hidden="true"></div>
  <div class="film-scratch-secondary" aria-hidden="true"></div>
  <div class="film-grain" aria-hidden="true"></div>

  <div id="header-mount"></div>

  <main id="main-content">
    <div id="hero-mount"></div>
    <div id="trailer-mount"></div>
    <div id="story-mount"></div>
    <div id="characters-mount"></div>
    <div id="gameplay-mount"></div>
    <div id="sequence-saltbaker-mount"></div>
    <div id="bosses-mount"></div>
    <div id="sequence-king-dice-mount"></div>
    <div id="dlc-mount"></div>
    <div id="play-mount"></div>
    <div id="sequence-devil-mount"></div>
  </main>

  <div id="footer-mount"></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
