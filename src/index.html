<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUPHEAD</title>
  <meta name="description" content="Tribute fan-made resmi game Cuphead oleh Studio MDHR. Pengalaman visual kartun klasik 1930-an dengan animasi frame-by-frame, boss showcase, dan audio jazz big band.">
  <link rel="icon" type="image/png" href="./assets/web/logo.png">
  <link rel="stylesheet" href="./css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
</head>
<body class="tv-screen-wrapper">
  <div id="preloader" class="preloader-overlay">
    <div class="preloader-spotlight" aria-hidden="true"></div>
    <div class="preloader-iris" aria-hidden="true"></div>

    <div class="preloader-content">
      <div class="preloader-cup-wrap">
        <div class="preloader-glow-ring"></div>
        <img src="./assets/images/cupheadCharacters/cuphead_idle_0001.png" alt="Cuphead Spotlight Preloader" class="preloader-cup-img">
      </div>

      <div class="preloader-title-wrap">
        <h2 class="preloader-title">STUDIO MDHR PRESENTS</h2>
        <p class="preloader-subtitle">AN INKWELL ISLES PRODUCTION IN 1930s CARTOON COLOR</p>
      </div>

      <div class="preloader-meter-box">
        <div class="preloader-bar-bg">
          <div id="preloader-bar" class="preloader-bar-fill"></div>
        </div>
        <div id="preloader-prompt" class="preloader-prompt">
          <span>NOW LOADING REEL</span>
          <span id="preloader-percent">0%</span>
        </div>
        <button id="preloader-start-btn" class="preloader-start-btn" style="display: none;">
          <span class="preloader-btn-a">A</span> ROLL FILM
        </button>
      </div>
    </div>
  </div>

  <div class="tv-scanlines" aria-hidden="true"></div>
  <div class="tv-vignette" aria-hidden="true"></div>
  <div class="film-scratch" aria-hidden="true"></div>
  <div class="film-scratch-secondary" aria-hidden="true"></div>
  <div class="film-grain" aria-hidden="true"></div>

  <div id="header-mount"></div>

  <main id="main-content">
    <div id="hero-mount"></div>
    <div id="trailer-mount"></div>
    <div id="story-mount"></div>
    <div id="characters-mount"></div>
    <div id="gameplay-mount"></div>
    <div id="bosses-mount"></div>
    <div id="sequence-saltbaker-mount"></div>
    <div id="sequence-king-dice-mount"></div>
    <div id="sequence-devil-mount"></div>
    <div id="dlc-mount"></div>
    <div id="play-mount"></div>
  </main>

  <div id="footer-mount"></div>

  <audio id="sfx-hover" src="./assets/web/parry.mp3" preload="auto"></audio>
  <audio id="sfx-click" src="./assets/web/click.mp3" preload="auto"></audio>
  <audio id="bgm-player" src="./assets/web/cuphead.mp3" preload="none" loop></audio>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
